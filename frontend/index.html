<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance System</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>AI Powered Attendance System</h1>
            <p>Face Recognition Based Smart Attendance</p>
        </div>

        <div class="dashboard">

            <!-- Registration -->
            <div class="card">

                <h2>Student Registration</h2>

                <input type="text" id="name" placeholder="Student Name">

                <input type="text" id="rollNo" placeholder="Roll Number">

                <input type="text" id="className" placeholder="Class">

                <input type="text" id="section" placeholder="Section">

                <label>Select Multiple Face Photos</label>

                <input type="file" id="images" multiple>

                <button onclick="registerStudent()">
                    Register Student
                </button>

            </div>

            <!-- Attendance -->
            <div class="card">

                <h2>Group Attendance</h2>

                <label>Upload Group Photo</label>

                <input type="file" id="groupImage">

                <button onclick="takeAttendance()">
                    Take Attendance
                </button>

            </div>

        </div>

        <!-- Results -->
        <div class="results">

            <h2>Recognition Results</h2>

            <div id="resultBox">

                <p>No attendance taken yet.</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
